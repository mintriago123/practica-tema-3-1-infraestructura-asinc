services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: practica31-rabbitmq
    hostname: practica31-rabbitmq
    user: "999:999"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Define RABBITMQ_DEFAULT_USER in your local .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Define RABBITMQ_DEFAULT_PASS in your local .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    build:
      context: ./runtime/backend
      dockerfile: Dockerfile
    image: nexo-practica31:local
    container_name: practica31-api
    entrypoint: ["php"]
    command: ["artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    working_dir: /app
    ports:
      - "127.0.0.1:8011:8000"
    environment: &app_environment
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8011
      APP_KEY: ${APP_KEY:-}
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/practica31.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:?Define RABBITMQ_DEFAULT_USER in your local .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?Define RABBITMQ_DEFAULT_PASS in your local .env}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-nexo.reportes.pedidos}
      RABBITMQ_DEAD_LETTER_QUEUE: ${RABBITMQ_DEAD_LETTER_QUEUE:-nexo.reportes.pedidos.dlq}
      PRACTICA31_PROCESSING_DELAY_MS: ${PRACTICA31_PROCESSING_DELAY_MS:-500}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    image: nexo-practica31:local
    container_name: practica31-consumer
    entrypoint: ["php"]
    command: ["artisan", "practica31:consumir-reportes"]
    working_dir: /app
    environment: *app_environment
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"

